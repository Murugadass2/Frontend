<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Portal — Find Your Dream Job</title>
    <meta name="description" content="Browse and apply for the latest job openings across India." />
    <link rel="stylesheet" href="css/style.css" />
    <style>
        body {
            display: block;
            align-items: unset;
            justify-content: unset;
        }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 32px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .navbar-logo {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 16px rgba(124, 58, 237, 0.35);
        }

        .navbar-title {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(90deg, var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .navbar-user {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .navbar-avatar {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
        }

        .navbar-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .btn-logout {
            padding: 8px 18px;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
        }

        .btn-logout:hover {
            border-color: var(--error);
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.1);
        }

        /* ── Hero / Search Section ── */
        .hero-section {
            padding: 48px 32px 32px;
            text-align: center;
        }

        .hero-section h1 {
            font-size: 32px;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .hero-section h1 span {
            background: linear-gradient(90deg, var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-section p {
            color: var(--text-secondary);
            font-size: 15px;
            margin-bottom: 28px;
        }

        .search-bar {
            display: flex;
            gap: 12px;
            max-width: 680px;
            margin: 0 auto 24px;
        }

        .search-bar .input-wrapper {
            flex: 1;
        }

        .search-bar .form-control {
            height: 52px;
            font-size: 15px;
            border-radius: var(--radius-md);
        }

        .search-btn {
            padding: 0 28px;
            height: 52px;
            background: linear-gradient(135deg, var(--primary), #5b21b6);
            border: none;
            border-radius: var(--radius-md);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.35);
        }

        .search-btn:hover {
            box-shadow: 0 6px 28px rgba(124, 58, 237, 0.55);
            transform: translateY(-1px);
        }

        /* ── Filter Chips ── */
        .filter-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            max-width: 700px;
            margin: 0 auto;
        }

        .filter-chip {
            padding: 8px 18px;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: 99px;
            color: var(--text-secondary);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
        }

        .filter-chip:hover,
        .filter-chip.active {
            border-color: var(--primary);
            color: var(--primary-light);
            background: rgba(124, 58, 237, 0.12);
        }

        /* ── Stats Strip ── */
        .stats-strip {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 20px 32px;
            margin-bottom: 8px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-num {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(90deg, var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        /* ── Jobs Grid ── */
        .jobs-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 32px 60px;
        }

        .jobs-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .jobs-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .jobs-count {
            font-size: 13px;
            color: var(--text-muted);
        }

        .jobs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        /* ── Job Card ── */
        .job-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 28px;
            backdrop-filter: blur(16px);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.5s ease both;
        }

        .job-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            opacity: 0;
            transition: opacity var(--transition);
        }

        .job-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(124, 58, 237, 0.2), 0 0 0 1px rgba(124, 58, 237, 0.1);
        }

        .job-card:hover::before {
            opacity: 1;
        }

        .job-card-top {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            margin-bottom: 16px;
        }

        .job-logo {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .job-info {
            flex: 1;
            min-width: 0;
        }

        .job-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .job-company {
            font-size: 13px;
            color: var(--primary-light);
            font-weight: 500;
        }

        .job-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 14px;
        }

        .job-meta-item {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .job-meta-item .emoji {
            font-size: 13px;
        }

        .job-type-badge {
            display: inline-flex;
            padding: 3px 10px;
            border-radius: 99px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-fulltime {
            background: rgba(34, 197, 94, 0.15);
            color: #86efac;
            border: 1px solid rgba(34, 197, 94, 0.25);
        }

        .badge-remote {
            background: rgba(6, 182, 212, 0.15);
            color: #67e8f9;
            border: 1px solid rgba(6, 182, 212, 0.25);
        }

        .badge-parttime {
            background: rgba(245, 158, 11, 0.15);
            color: #fcd34d;
            border: 1px solid rgba(245, 158, 11, 0.25);
        }

        .badge-internship {
            background: rgba(244, 114, 182, 0.15);
            color: #f9a8d4;
            border: 1px solid rgba(244, 114, 182, 0.25);
        }

        .job-desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .job-skills {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 18px;
        }

        .skill-tag {
            padding: 4px 10px;
            background: rgba(124, 58, 237, 0.1);
            border: 1px solid rgba(124, 58, 237, 0.2);
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
            color: var(--primary-light);
        }

        .job-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }

        .job-salary {
            font-size: 14px;
            font-weight: 700;
            color: var(--success);
        }

        .btn-apply {
            padding: 8px 22px;
            background: linear-gradient(135deg, var(--primary), #5b21b6);
            border: none;
            border-radius: var(--radius-sm);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: 0 2px 12px rgba(124, 58, 237, 0.3);
        }

        .btn-apply:hover {
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.5);
            transform: translateY(-1px);
        }

        .job-posted {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* ── No Results ── */
        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .no-results .emoji-big {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .no-results h3 {
            font-size: 18px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .no-results p {
            font-size: 14px;
        }

        /* ── Loading Skeleton ── */
        .skeleton-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 28px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .skeleton-line {
            background: var(--bg-glass);
            border-radius: 6px;
            margin-bottom: 12px;
        }

        .skeleton-line.title {
            height: 20px;
            width: 70%;
        }

        .skeleton-line.sub {
            height: 14px;
            width: 50%;
        }

        .skeleton-line.body {
            height: 12px;
            width: 100%;
        }

        .skeleton-line.short {
            height: 12px;
            width: 60%;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .navbar {
                padding: 12px 16px;
            }

            .navbar-name {
                display: none;
            }

            .hero-section {
                padding: 32px 16px 24px;
            }

            .hero-section h1 {
                font-size: 24px;
            }

            .search-bar {
                flex-direction: column;
            }

            .search-btn {
                width: 100%;
            }

            .stats-strip {
                gap: 20px;
            }

            .jobs-container {
                padding: 0 16px 40px;
            }

            .jobs-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 500px) {
            .filter-row {
                gap: 6px;
            }

            .filter-chip {
                padding: 6px 12px;
                font-size: 12px;
            }

            .stat-num {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-brand">
            <div class="navbar-logo">💼</div>
            <span class="navbar-title">JobPortal</span>
        </div>
        <div class="navbar-user">
            <span class="navbar-name" id="nav-username">User</span>
            <div class="navbar-avatar" id="nav-avatar">U</div>
            <button class="btn-logout" id="logout-btn">🚪 Sign Out</button>
        </div>
    </nav>

    <!-- Hero / Search -->
    <section class="hero-section">
        <h1>Find Your <span>Dream Job</span> Today</h1>
        <p>Browse thousands of opportunities from top companies across India</p>

        <div class="search-bar">
            <div class="input-wrapper">
                <span class="input-icon">🔍</span>
                <input type="text" id="search-input" class="form-control"
                    placeholder="Search jobs, companies, skills..." />
            </div>
            <button class="search-btn" id="search-btn">Search</button>
        </div>

        <div class="filter-row" id="filter-row">
            <button class="filter-chip active" data-filter="all">All Jobs</button>
            <button class="filter-chip" data-filter="Full-Time">💼 Full-Time</button>
            <button class="filter-chip" data-filter="Remote">🌐 Remote</button>
            <button class="filter-chip" data-filter="Part-Time">⏰ Part-Time</button>
            <button class="filter-chip" data-filter="Internship">🎓 Internship</button>
            <button class="filter-chip" data-filter="Chennai">📍 Chennai</button>
            <button class="filter-chip" data-filter="Bangalore">📍 Bangalore</button>
        </div>
    </section>

    <!-- Stats -->
    <div class="stats-strip">
        <div class="stat-item">
            <div class="stat-num">500+</div>
            <div class="stat-label">Active Jobs</div>
        </div>
        <div class="stat-item">
            <div class="stat-num">120+</div>
            <div class="stat-label">Companies</div>
        </div>
        <div class="stat-item">
            <div class="stat-num">10K+</div>
            <div class="stat-label">Job Seekers</div>
        </div>
        <div class="stat-item">
            <div class="stat-num">95%</div>
            <div class="stat-label">Success Rate</div>
        </div>
    </div>

    <!-- Job Listings -->
    <div class="jobs-container">
        <div class="jobs-header">
            <h2>🔥 Latest Openings</h2>
            <span class="jobs-count" id="jobs-count">Loading...</span>
        </div>
        <div class="jobs-grid" id="jobs-grid">
            <!-- Skeleton loading -->
            <div class="skeleton-card">
                <div class="skeleton-line title"></div>
                <div class="skeleton-line sub"></div>
                <div class="skeleton-line body"></div>
                <div class="skeleton-line body"></div>
                <div class="skeleton-line short"></div>
            </div>
            <div class="skeleton-card">
                <div class="skeleton-line title"></div>
                <div class="skeleton-line sub"></div>
                <div class="skeleton-line body"></div>
                <div class="skeleton-line body"></div>
                <div class="skeleton-line short"></div>
            </div>
            <div class="skeleton-card">
                <div class="skeleton-line title"></div>
                <div class="skeleton-line sub"></div>
                <div class="skeleton-line body"></div>
                <div class="skeleton-line body"></div>
                <div class="skeleton-line short"></div>
            </div>
        </div>
    </div>

    <script src="js/job-portal.js"></script>
</body>

</html>
