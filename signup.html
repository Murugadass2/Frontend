<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up — SecureAuth</title>
    <meta name="description" content="Create a new SecureAuth account with email verification." />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="page">
        <div class="card">
            <div class="brand">
                <div class="brand-icon">✨</div>
                <h1>Create Account</h1>
                <p>Join us today — it only takes a minute</p>
            </div>

            <div id="alert-box"></div>

            <form id="signup-form" novalidate>
                <div class="form-group">
                    <label for="full_name">Full Name</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" id="full_name" class="form-control" placeholder="Your Name"
                            autocomplete="name" required />
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <span class="input-icon">✉️</span>
                        <input type="email" id="email" class="form-control" placeholder="you@example.com"
                            autocomplete="email" required />
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" class="form-control" placeholder="Minimum 6 characters"
                            autocomplete="new-password" required />
                        <button type="button" class="toggle-password" id="toggle-pass">👁️</button>
                    </div>
                    <!-- Password strength -->
                    <div class="strength-bar" id="strength-bar">
                        <div class="strength-segment" id="seg-1"></div>
                        <div class="strength-segment" id="seg-2"></div>
                        <div class="strength-segment" id="seg-3"></div>
                        <div class="strength-segment" id="seg-4"></div>
                    </div>
                    <div class="strength-label" id="strength-label"></div>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔑</span>
                        <input type="password" id="confirm_password" class="form-control"
                            placeholder="Re-enter your password" autocomplete="new-password" required />
                        <button type="button" class="toggle-password" id="toggle-confirm">👁️</button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="signup-btn">
                    <span id="btn-text">Create Account &amp; Send OTP</span>
                </button>
            </form>

            <div class="footer-link">
                Already have an account? <a href="index.html">Sign in</a>
            </div>
        </div>
    </div>

    <script src="js/signup.js"></script>
</body>

</html>
