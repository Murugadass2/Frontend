<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — SecureAuth</title>
  <meta name="description" content="Sign in to your SecureAuth account securely." />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <!-- Background Orbs -->
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="page">
    <div class="card">
      <!-- Brand -->
      <div class="brand">
        <div class="brand-icon">🔐</div>
        <h1>Welcome Back</h1>
        <p>Sign in to your account to continue</p>
      </div>

      <!-- Alert Placeholder -->
      <div id="alert-box"></div>

      <!-- Login Form -->
      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <span class="input-icon">✉️</span>
            <input type="email" id="email" class="form-control" placeholder="you@example.com" autocomplete="email"
              required />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="password" class="form-control" placeholder="Enter your password"
              autocomplete="current-password" required />
            <button type="button" class="toggle-password" id="toggle-pass"
              aria-label="Toggle password visibility">👁️</button>
          </div>
        </div>

        <div class="checkbox-wrapper">
          <input type="checkbox" id="remember" />
          <label for="remember">Remember me for 7 days</label>
        </div>

        <button type="submit" class="btn btn-primary" id="login-btn">
          <span id="btn-text">Sign In</span>
        </button>
      </form>

      <div class="divider">or</div>

      <div class="footer-link">
        Don't have an account? <a href="signup.html">Create one</a>
      </div>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>

</html>
