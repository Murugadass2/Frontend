<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose Your Role — SecureAuth</title>
    <meta name="description" content="Select whether you are a Job Seeker or Job Provider." />
    <link rel="stylesheet" href="css/style.css" />
    <style>
        .role-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin: 32px 0 28px;
        }

        .role-card {
            position: relative;
            background: var(--bg-glass);
            border: 2px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 32px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .role-card::before {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.35s ease;
            border-radius: inherit;
        }

        .role-card.seeker::before {
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.15), rgba(6, 182, 212, 0.10));
        }

        .role-card.provider::before {
            background: linear-gradient(135deg, rgba(244, 114, 182, 0.15), rgba(249, 115, 22, 0.10));
        }

        .role-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(124, 58, 237, 0.2);
        }

        .role-card:hover::before {
            opacity: 1;
        }

        .role-card.selected {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.25), 0 12px 32px rgba(124, 58, 237, 0.3);
            transform: translateY(-4px);
        }

        .role-card.selected::before {
            opacity: 1;
        }

        .role-card .role-icon {
            position: relative;
            z-index: 1;
            width: 72px;
            height: 72px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 34px;
            transition: transform 0.3s ease;
        }

        .role-card.seeker .role-icon {
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.25), rgba(6, 182, 212, 0.15));
        }

        .role-card.provider .role-icon {
            background: linear-gradient(135deg, rgba(244, 114, 182, 0.25), rgba(249, 115, 22, 0.15));
        }

        .role-card:hover .role-icon {
            transform: scale(1.1);
        }

        .role-card .role-title {
            position: relative;
            z-index: 1;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .role-card .role-desc {
            position: relative;
            z-index: 1;
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .role-card .check-mark {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: #fff;
            opacity: 0;
            transform: scale(0);
            transition: all 0.3s ease;
        }

        .role-card.selected .check-mark {
            opacity: 1;
            transform: scale(1);
        }

        @media (max-width: 400px) {
            .role-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="page">
        <div class="card" style="max-width: 520px;">
            <div class="brand">
                <div class="brand-icon">🎯</div>
                <h1>Choose Your Role</h1>
                <p>Tell us how you'd like to use the platform</p>
            </div>

            <div id="alert-box"></div>

            <div class="role-grid">
                <!-- Job Seeker -->
                <div class="role-card seeker" data-role="job_seeker" id="card-seeker">
                    <div class="check-mark">✓</div>
                    <div class="role-icon">🔍</div>
                    <div class="role-title">Job Seeker</div>
                    <div class="role-desc">I'm looking for job opportunities</div>
                </div>

                <!-- Job Provider -->
                <div class="role-card provider" data-role="job_provider" id="card-provider">
                    <div class="check-mark">✓</div>
                    <div class="role-icon">🏢</div>
                    <div class="role-title">Job Provider</div>
                    <div class="role-desc">I want to post jobs & hire talent</div>
                </div>
            </div>

            <button class="btn btn-primary" id="continue-btn" disabled style="opacity:0.5;">
                <span id="btn-text">Select a role to continue</span>
            </button>
        </div>
    </div>

    <script src="js/role-selection.js"></script>
</body>

</html>
